name: ci

# Непрерывная интеграция сигналинг-сервера. Четыре режима работы конвейера:
#   1. сборка образа и запуск сервера в контейнере, лог запуска сохраняется   (job image)
#   2. автотесты; без них изменения в main не влить (обязательная проверка)   (job test)
#   3. проверочный контейнер на VPS и проба снаружи                           (deploy.yml, job staging)
#   4. замена рабочего контейнера после ручного подтверждения, с откатом      (deploy.yml, job production)
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Автотесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # Модули без нативного кода: протокол, клиент и сервер сигналинга, медиа-утилиты.
      # Модули с нативными библиотеками (media-engine, app-client) тестируются на машине разработчика.
      - name: Тесты
        run: ./gradlew --no-daemon :protocol:test :signaling-client:test :signaling-server:test :media:test

      - name: Отчёт о тестах
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            */build/reports/tests/test/
            */build/test-results/test/*.xml
          retention-days: 14

      - name: Сводка по тестам
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET
          total = failed = skipped = 0
          for f in glob.glob('*/build/test-results/test/*.xml'):
              r = ET.parse(f).getroot()
              total += int(r.get('tests', 0))
              failed += int(r.get('failures', 0)) + int(r.get('errors', 0))
              skipped += int(r.get('skipped', 0))
          print(f"### Автотесты\n\nвсего {total}, не прошло {failed}, пропущено {skipped}")
          PY

  image:
    name: Сборка образа и запуск в контейнере
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Сборка образа
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: sertas-signaling:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Запуск сервера в контейнере
        run: |
          docker run -d --name signaling --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges:true --memory 384m \
            -e SERTAS_TOKEN=ci-token -p 8080:8080 sertas-signaling:ci
          for _ in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' signaling)" = healthy ] && break
            sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' signaling | grep -qx healthy
          curl -fsS http://localhost:8080/health
          curl -fsS http://localhost:8080/metrics | grep sertas_uptime_seconds

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Проба - два клиента видят друг друга через сервер в контейнере
        env:
          SERTAS_TEST_URL: ws://localhost:8080/signal?token=ci-token
        run: ./gradlew --no-daemon :signaling-server:test --tests '*DeployedServerProbeTest*'

      - name: Лог запуска
        if: always()
        run: docker logs signaling > signaling-startup.log 2>&1 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signaling-startup-log
          path: signaling-startup.log
          retention-days: 14

  security:
    name: Сканирование уязвимостей (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Dockerfile и конфигурация (misconfiguration)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Сборка образа
        run: docker build -t sertas-signaling:scan .

      - name: Образ - уязвимости ОС и библиотек
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: sertas-signaling:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
          output: trivy-image.txt

      - name: Отчёт сканирования
        if: always()
        run: cat trivy-image.txt >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-report
          path: trivy-image.txt
          retention-days: 14
