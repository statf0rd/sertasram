name: deploy

# Непрерывная доставка: образ в реестр GitHub -> проверочный контейнер на VPS ->
# проба снаружи -> ручное подтверждение -> замена рабочего контейнера (с откатом).
#
# Секреты репозитория: VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_KNOWN_HOSTS, STAGING_TOKEN.
# Окружение production должно иметь правило Required reviewers - это и есть ручное подтверждение.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/statf0rd/stars-signaling

jobs:
  publish:
    name: Образ в реестр
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.ref.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - id: ref
        run: echo "image=$IMAGE:$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      # Сервер может быть на ARM: образ собирается под обе архитектуры.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Образ помечается номером коммита: по нему видно, что запущено, и к нему можно откатиться.
      - uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_SUMMARY: false
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.ref.outputs.image }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  staging:
    name: Проверочный контейнер на VPS
    needs: publish
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Ключ SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Конфигурация на сервер
        run: |
          rsync -az --delete --exclude .env --exclude .release --exclude alertmanager/telegram_token \
            deploy/ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/sertas/deploy/"

      # Пакет в ghcr.io может быть приватным: сервер получает образ по временному токену задания,
      # после загрузки учётные данные с сервера удаляются.
      - name: Запуск проверочного контейнера
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"
          trap 'ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "docker logout ghcr.io"' EXIT
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "cd /opt/sertas/deploy && docker pull '${{ needs.publish.outputs.image }}' && STAGING_TOKEN='${{ secrets.STAGING_TOKEN }}' ./scripts/release.sh staging '${{ needs.publish.outputs.image }}'"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          add-job-summary: never

      - name: Проба снаружи - сервер принимает подключения
        env:
          SERTAS_TEST_URL: ws://${{ secrets.VPS_HOST }}:18080/signal?token=${{ secrets.STAGING_TOKEN }}
        run: |
          curl -fsS "http://${{ secrets.VPS_HOST }}:18080/health"
          ./gradlew --no-daemon :signaling-server:test --tests '*DeployedServerProbeTest*'

  production:
    name: Замена рабочего контейнера
    needs: [publish, staging]
    runs-on: ubuntu-latest
    # Задание ждёт подтверждения ревьюера окружения production.
    environment: production
    steps:
      - name: Ключ SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      # release.sh promote сам откатывается на предыдущий образ, если новый контейнер не стал healthy.
      - name: Замена контейнера
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "cd /opt/sertas/deploy && ./scripts/release.sh promote '${{ needs.publish.outputs.image }}' && ./scripts/release.sh status"
