# Оповещения в Telegram. Токен бота лежит в файле telegram_token рядом (в репозиторий не попадает),
# chat_id - идентификатор чата, куда бот пишет; подставляется при запуске из TELEGRAM_CHAT_ID в .env.
route:
  receiver: telegram
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: telegram
    telegram_configs:
      - bot_token_file: /etc/alertmanager/telegram_token
        chat_id: __TELEGRAM_CHAT_ID__
        parse_mode: HTML
        send_resolved: true
        message: |
          <b>{{ .Status | toUpper }}</b>: {{ .CommonAnnotations.summary }}
          {{ .CommonAnnotations.description }}
